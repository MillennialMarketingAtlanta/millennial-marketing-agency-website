name: Automated Blog Publishing

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate any due blog drafts
        run: npm run blog:automate

      - name: Build blog pages
        run: npm run build

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/blog-automation.yml scripts/automate-blog-publishing.js scripts/automate-blog-publishing.test.js content/blog content/calendar.json blog package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No blog changes to publish."
            exit 0
          fi
          git commit -m "chore: automate blog publishing"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
