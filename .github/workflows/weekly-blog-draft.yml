name: Weekly Blog Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for queued topic
        id: topic_check
        run: |
          HAS_TOPIC=$(node -e "const fs=require('fs'); const items=JSON.parse(fs.readFileSync('content/calendar.json','utf8')); process.stdout.write(items.some((entry)=>entry.status==='queued') ? 'true' : 'false');")
          echo "has_topic=$HAS_TOPIC" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.topic_check.outputs.has_topic == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.topic_check.outputs.has_topic == 'true'
        run: npm ci

      - name: Generate weekly draft
        if: steps.topic_check.outputs.has_topic == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-sonnet-latest' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
        run: npm run blog:draft

      - name: Build blog pages
        if: steps.topic_check.outputs.has_topic == 'true'
        run: npm run build

      - name: Commit and push published blog updates
        if: steps.topic_check.outputs.has_topic == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog content/calendar.json blog
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish weekly blog post"
          git push

      - name: No queued topics
        if: steps.topic_check.outputs.has_topic != 'true'
        run: echo "No queued topics in content/calendar.json. Skipping publish run."