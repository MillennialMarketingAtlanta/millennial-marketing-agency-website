    <style>
        @font-face {
            font-family: 'FreightDisp Pro';
            src: url('assets/fonts/FreightDispPro-Regular.woff') format('woff'),
                 url('assets/fonts/FreightDispPro-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'FreightDisp Pro';
            src: url('assets/fonts/FreightDispPro-LightItalic.woff') format('woff'),
                 url('assets/fonts/FreightDispPro-LightItalic.ttf') format('truetype');
            font-weight: 300;
            font-style: italic;
            font-display: swap;
        }

        :root {
            --coming-overlay: rgba(16, 13, 11, 0.46);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;
            background: linear-gradient(var(--coming-overlay), var(--coming-overlay)), url('design-assets/Links/Zuzka_Vaclavik_636.jpg') center / cover no-repeat;
            color: #fff;
        }

        .coming-shell {
            min-height: 100svh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 7.2rem 1.6rem 2rem;
        }

        .panel {
            width: min(620px, 100%);
            text-align: center;
            padding: 0;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.35rem;
        }

        h1 {
            font-family: 'FreightDisp Pro', 'Playfair Display', serif;
            font-size: clamp(1.1rem, 2.6vw, 2.1rem);
            font-weight: 400;
            line-height: 1.2;
            margin: 0;
        }

        h1 em {
            font-style: italic;
            font-weight: 300;
        }

        .coming-shell .nav-menu-footer p {
            color: #000;
            text-align: left;
            margin: 0;
        }

        .coming-shell .nav-menu-footer {
            justify-content: flex-start;
        }

        .coming-shell .nav-menu-social {
            margin-left: auto;
        }

        p {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.94rem;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.92);
            margin: 0;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-link {
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.78);
            display: inline-block;
            padding: 0 1.4rem 0.18rem 0;
            position: relative;
            font-weight: 600;
            letter-spacing: 0.02em;
            font-size: 0.95rem;
            margin: 0;
        }

        .back-link::after {
            content: '\2192';
            position: absolute;
            right: 0;
            top: 49%;
            transform: translateY(-50%);
        }

        @media (max-width: 600px) {
            .hero {
                padding: 6.6rem 1.2rem 1.6rem;
            }

            .panel {
                width: 100%;
            }

            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 0.9rem;
            }
        }
    </style>
